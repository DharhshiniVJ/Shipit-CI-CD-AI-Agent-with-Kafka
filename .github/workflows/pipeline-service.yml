name: pipeline-service CI

on:
  push:
    paths:
      - "pipeline-service/**"
      - ".github/workflows/pipeline-service.yml"
  pull_request:
    paths:
      - "pipeline-service/**"

jobs:
  ci:
    name: Lint, Vet & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: pipeline-service/go.sum

      - name: Download dependencies
        run: go mod download

      - name: go vet (static analysis)
        run: go vet ./...

      - name: Build binary
        run: go build -o /dev/null ./...
