services:
  # ── Kafka (KRaft mode, no Zookeeper) ──────────────────────────────────────
  kafka:
    image: apache/kafka:latest
    container_name: shipit-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine   # alpine = small, fast image (~80MB)
    container_name: shipit-postgres
    ports:
      - "5432:5432"             # default Postgres port
    environment:
      POSTGRES_USER: shipit
      POSTGRES_PASSWORD: shipit
      POSTGRES_DB: pipeline_db
    # Named volume: data persists even if the container is stopped/removed.
    # Without this, every `docker-compose down` would wipe the database.
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── Go Microservices ───────────────────────────────────────────────────────
  pipeline-service:
    build:
      context: ./pipeline-service
    ports:
      - "8080:8080"
      - "9100:9100"   # Prometheus metrics
    depends_on:
      - kafka
      - postgres
    environment:
      - KAFKA_BROKER=kafka:29092
      - DB_HOST=postgres
      - DB_USER=shipit
      - DB_PASSWORD=shipit
      - DB_NAME=pipeline_db
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}  # GitHub webhook secret
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    restart: on-failure

  build-service:
    build:
      context: ./build-service
    ports:
      - "9101:9100"   # Prometheus metrics (host:container)
    depends_on:
      - kafka
      - postgres
    environment:
      - KAFKA_BROKER=kafka:29092
      - DB_HOST=postgres
      - DB_USER=shipit
      - DB_PASSWORD=shipit
      - DB_NAME=pipeline_db
      - GITHUB_TOKEN=${GITHUB_TOKEN}   # for cloning repos
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - type: bind
        source: //var/run/docker.sock
        target: /var/run/docker.sock
    restart: on-failure

  deploy-service:
    build:
      context: ./deploy-service
    ports:
      - "9102:9100"   # Prometheus metrics (host:container)
    volumes:
      - ~/.kube:/root/.kube:ro
    depends_on:
      - kafka
      - postgres
    environment:
      - KAFKA_BROKER=kafka:29092
      - DB_HOST=postgres
      - DB_USER=shipit
      - DB_PASSWORD=shipit
      - DB_NAME=pipeline_db
    restart: on-failure

  notify-service:
    build:
      context: ./notify-service
    ports:
      - "9103:9100"   # Prometheus metrics (host:container)
    depends_on:
      - kafka
    environment:
      - KAFKA_BROKER=kafka:29092
    restart: on-failure

  # ── AI Worker (Python) ─────────────────────────────────────────────────────
  ai-worker:
    build:
      context: ./ai-worker
    ports:
      - "9104:9101"   # Prometheus metrics (host:container)
    depends_on:
      - kafka
    env_file:
      - ./ai-worker/.env
    environment:
      - KAFKA_BROKER=kafka:29092
    restart: on-failure

  # ── Monitoring ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: shipit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    restart: on-failure

  grafana:
    image: grafana/grafana:latest
    container_name: shipit-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=shipit
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: on-failure

# Named volumes — data persists across container restarts.
volumes:
  postgres_data:
  grafana_data:
